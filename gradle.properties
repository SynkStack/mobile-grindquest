# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries instead of the deprecated Support Library.
android.useAndroidX=true

# Kotlin code style used by IDE formatters and linters.
kotlin.code.style=official

# Enable Gradle's configuration cache for faster builds.
org.gradle.configuration-cache=true

# Enable parallel project execution.
org.gradle.parallel=true

# Non-transitive R classes reduce the size of generated R classes for libraries.
android.nonTransitiveRClass=true
